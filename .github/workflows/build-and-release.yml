name: Build and Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update Version in Files (from tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          Write-Output "Updating version to $version from tag $tag"

          # 1. Update StickyNotes.csproj
          $csprojPath = "src/StickyNotes/StickyNotes.csproj"
          $csprojContent = Get-Content $csprojPath -Raw
          $csprojContent = $csprojContent -replace '<Version>[^<]+</Version>', "<Version>$version</Version>"
          $csprojContent = $csprojContent -replace '<AssemblyVersion>[^<]+</AssemblyVersion>', "<AssemblyVersion>$version.0</AssemblyVersion>"
          $csprojContent = $csprojContent -replace '<FileVersion>[^<]+</FileVersion>', "<FileVersion>$version.0</FileVersion>"
          Set-Content $csprojPath $csprojContent

          # 2. Update installer.iss
          $issPath = "installer.iss"
          $issContent = Get-Content $issPath -Raw
          $issContent = $issContent -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion ""$version"""
          $issContent = $issContent -replace 'AppVersion=[^\r\n]+', "AppVersion=$version"
          Set-Content $issPath $issContent

      - name: Commit version updates
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/StickyNotes/StickyNotes.csproj installer.iss
          git commit -m "Auto-update version files to ${{ github.ref_name }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Run Unit Tests
        run: dotnet test tests/StickyNotes.Tests/StickyNotes.Tests.csproj -c Release

      - name: Publish self-contained WinUI 3 app
        run: dotnet publish src/StickyNotes/StickyNotes.csproj -c Release -r win-x64 --self-contained true -p:WindowsAppSDKSelfContained=true -p:Platform=x64

      - name: Generate Code Signing Certificate & Sign Executable
        shell: pwsh
        run: |
          Write-Host "Creating Code Signing Certificate..."
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=Manikanda Bharathi, O=StickyNotes, OU=Development" `
            -KeyUsage DigitalSignature `
            -FriendlyName "Sticky Notes Authenticode Certificate" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3") `
            -NotAfter (Get-Date).AddYears(5)

          $certPath = Join-Path $PWD "StickyNotesCert.pfx"
          $cerPath = Join-Path $PWD "StickyNotesCert.cer"
          $certPass = "StickyNotesPass123!"
          $secPass = ConvertTo-SecureString -String $certPass -Force -AsPlainText

          Export-PfxCertificate -Cert $cert -FilePath $certPath -Password $secPass
          Export-Certificate -Cert $cert -FilePath $cerPath

          # Find Windows SDK SignTool
          $signtoolItem = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if ($null -eq $signtoolItem) {
            $signtoolItem = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Select-Object -First 1
          }

          if ($signtoolItem) {
            $signtool = $signtoolItem.FullName
            Write-Host "Located SignTool at: $signtool"
            $exePath = "src/StickyNotes/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/publish/StickyNotes.exe"
            if (Test-Path $exePath) {
              Write-Host "Signing executable: $exePath"
              & $signtool sign /f $certPath /p $certPass /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exePath
            }
          } else {
            Write-Warning "SignTool not found in Windows Kits."
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build Installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Sign Inno Setup Installer
        shell: pwsh
        run: |
          $signtoolItem = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if ($null -eq $signtoolItem) {
            $signtoolItem = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Select-Object -First 1
          }

          if ($signtoolItem) {
            $signtool = $signtoolItem.FullName
            $certPath = Join-Path $PWD "StickyNotesCert.pfx"
            $certPass = "StickyNotesPass123!"

            if (Test-Path "StickyNotes-setup.exe") {
              Write-Host "Signing Installer: StickyNotes-setup.exe"
              & $signtool sign /f $certPath /p $certPass /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "StickyNotes-setup.exe"
            }
          }

      - name: Archive published output and installer
        uses: actions/upload-artifact@v4
        with:
          name: StickyNotes-windows-x64
          path: |
            StickyNotes-setup.exe
            StickyNotesCert.cer

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: StickyNotes-windows-x64
          path: release-artifact

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifact/StickyNotes-setup.exe
            release-artifact/StickyNotesCert.cer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
